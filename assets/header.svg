<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Yao Lai - Machine Learning for Chip Design">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="55%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F778BA" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#58A6FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <clipPath id="t1"><rect x="100" y="116" height="32" width="0">
      <animate attributeName="width" values="0;376;376;0;0" keyTimes="0;0.125;0.2917;0.3333;1" dur="12s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="t2"><rect x="100" y="116" height="32" width="0">
      <animate attributeName="width" values="0;0;365;365;0;0" keyTimes="0;0.3333;0.4583;0.625;0.6667;1" dur="12s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="t3"><rect x="100" y="116" height="32" width="0">
      <animate attributeName="width" values="0;0;342;342;0" keyTimes="0;0.6667;0.7917;0.9583;1" dur="12s" repeatCount="indefinite"/>
    </rect></clipPath>

    <style>
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      .name { font: 700 52px 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font: 19px ui-monospace, 'JetBrains Mono', 'Fira Code', SFMono-Regular, Menlo, monospace; }
      .small { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="1000" height="220" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="220" rx="14" fill="url(#grid)"/>

  <!-- circuit traces -->
  <g fill="none" stroke="#58A6FF" stroke-width="1.6" stroke-opacity="0.45">
    <path d="M1000 46 H880 L852 74 H700"/>
    <path d="M1000 96 H930 L906 120 H812"/>
    <path d="M1000 176 H900 L874 150 H744"/>
    <path d="M700 74 V150"/>
    <path d="M812 120 H744"/>
  </g>
  <g fill="none" stroke="#F778BA" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 240">
    <path d="M1000 46 H880 L852 74 H700 V150 H874 L900 176 H1000">
      <animate attributeName="stroke-dashoffset" from="500" to="0" dur="4.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#58A6FF">
    <rect x="694" y="68" width="12" height="12" rx="2" class="pulse"/>
    <rect x="806" y="114" width="12" height="12" rx="2" class="pulse" style="animation-delay:.6s"/>
    <rect x="738" y="144" width="12" height="12" rx="2" class="pulse" style="animation-delay:1.2s"/>
  </g>
  <g fill="none" stroke="#58A6FF" stroke-opacity="0.5" stroke-width="1.6">
    <rect x="836" y="86" width="64" height="64" rx="6"/>
    <rect x="854" y="104" width="28" height="28" rx="3" fill="#58A6FF" fill-opacity="0.18"/>
  </g>

  <!-- text block -->
  <text class="name" x="70" y="88" fill="#FFFFFF">Yao Lai</text>
  <rect x="70" y="100" width="150" height="3" rx="1.5" fill="url(#rule)"/>

  <text class="mono" x="70" y="140" fill="#3FB950">$</text>
  <g clip-path="url(#t1)"><text class="mono" x="100" y="140" fill="#58A6FF">Postdoc @ University of Cambridge</text></g>
  <g clip-path="url(#t2)"><text class="mono" x="100" y="140" fill="#58A6FF">Machine Learning for Chip Design</text></g>
  <g clip-path="url(#t3)"><text class="mono" x="100" y="140" fill="#58A6FF">Simulate before you fabricate.</text></g>
  <rect class="blink" y="122" width="9" height="22" fill="#58A6FF" x="100">
    <animate attributeName="x" values="100;476;476;100;100;465;465;100;100;442;442;100"
             keyTimes="0;0.125;0.2917;0.3333;0.3333;0.4583;0.625;0.6667;0.6667;0.7917;0.9583;1"
             dur="12s" repeatCount="indefinite"/>
  </rect>

  <text class="small" x="70" y="180" fill="#7D8590">PLACEMENT &#183; ANALOG &#183; LITHOGRAPHY &#183; ACCELERATOR MODELING</text>
</svg>

name: Profile assets

on:
  schedule:
    - cron: "0 3 * * *"      # daily
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: laiyao1
          outputs: snake.svg?palette=github-dark

      - name: Commit snake.svg
        run: |
          cp snake.svg snake.svg.tmp && mv snake.svg.tmp snake.svg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snake.svg
          git diff --staged --quiet || git commit -m "chore: update snake"
          git push
